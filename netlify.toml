"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Supabase public client configuration is managed in Netlify site environment variables.
[build]
  base = "sports-os"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
