"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# The repository contains the Next.js application in sports-os/.
# Netlify runs the build from that directory; the Next.js plugin serves
# App Router routes such as / and /login (no SPA fallback rewrite is needed).
[build]
  base = "sports-os"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
