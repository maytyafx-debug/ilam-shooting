name: Sports OS dependency install and validation

on:
  pull_request:
    paths:
      - "sports-os/**"
      - ".github/workflows/sports-os-validation.yml"
      - "register-athlete.html"
      - "register-competition.html"
      - "register-member.html"
      - "calendar.html"
      - "functions/api/submit.js"
      - "supabase/migrations/**"
  push:
    branches:
      - "feat/metatya-sports-os-foundation-v1"
      - "feat/sports-os-shooting-integrated-v1"
    paths:
      - "sports-os/**"
      - ".github/workflows/sports-os-validation.yml"
      - "register-athlete.html"
      - "register-competition.html"
      - "register-member.html"
      - "calendar.html"
      - "functions/api/submit.js"
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: sports-os-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build

      - name: Static security regression checks
        working-directory: .
        run: node sports-os/tests/security-static.mjs

      - name: Master architecture contract checks
        working-directory: .
        run: node sports-os/tests/architecture-contract.mjs

      - name: Administrative modules and MFA contract checks
        working-directory: .
        run: node sports-os/tests/admin-v1-security-contract.mjs

      - name: Check legacy JavaScript syntax
        working-directory: .
        run: node --check sports-os/app.js

      - name: Validate product demo and legacy routes
        working-directory: .
        run: node sports-os/tests/validate-demo.mjs
