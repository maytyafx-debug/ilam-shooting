name: Sports OS dependency install and validation

on:
  pull_request:
    paths:
      - "sports-os/**"
      - ".github/workflows/sports-os-validation.yml"
      - "register-athlete.html"
      - "register-competition.html"
      - "register-member.html"
      - "calendar.html"
      - "functions/api/submit.js"
      - "supabase/migrations/**"
  push:
    branches:
      - "feat/metatya-sports-os-foundation-v1"
      - "feat/sports-os-shooting-integrated-v1"
    paths:
      - "sports-os/**"
      - ".github/workflows/sports-os-validation.yml"
      - "register-athlete.html"
      - "register-competition.html"
      - "register-member.html"
      - "calendar.html"
      - "functions/api/submit.js"
      - "supabase/migrations/**"

permissions:
  contents: write

concurrency:
  group: sports-os-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated package lock
        working-directory: .
        run: |
          if [ -f sports-os/package-lock.json ] && ! git diff --quiet -- sports-os/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sports-os/package-lock.json
            git commit -m "chore(sports-os): add npm lockfile"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: TypeScript validation
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build

      - name: Check legacy JavaScript syntax
        working-directory: .
        run: node --check sports-os/app.js

      - name: Validate product demo and legacy routes
        working-directory: .
        run: node sports-os/tests/validate-demo.mjs
