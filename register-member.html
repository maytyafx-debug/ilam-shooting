<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>عضویت در هیأت | تیراندازی ایلام</title>
<link rel="stylesheet" href="style.css" />
<style>
  .page-header { padding: 120px 0 40px; text-align: center; }
  .page-header h1 { font-size: 2.2rem; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0B0F14" stroke-width="2.5"><circle cx="12" cy="12" r="9"/></svg></span><span>هیأت تیراندازی ایلام</span></a>
    <nav class="nav-links"><a href="index.html">← بازگشت به خانه</a></nav>
  </div>
</header>
<div class="page-header">
  <h1>ثبت‌نام اعضای جدید</h1>
  <p>فرم پیش‌ثبت‌نام برای علاقه‌مندان به همکاری یا عضویت در هیأت.</p>
</div>
<div class="container">
  <div class="form-box">
    <form action="/api/submit" method="POST">
      <div class="form-group"><label>نام و نام خانوادگی</label><input type="text" name="name" required></div>
      <div class="form-group"><label>کد ملی</label><input type="text" name="national_id" required></div>
      <div class="form-group"><label>شماره تماس</label><input type="tel" name="phone" required></div>
      <div class="form-group"><label>سابقه ورزشی (اختیاری)</label><textarea name="background" rows="3"></textarea></div>
      <button type="submit" class="btn-submit">ثبت درخواست عضویت</button>
    </form>
  </div>
</div>
<footer><p>© ۱۴۰۵ هیأت تیراندازی ایلام</p></footer>
</body>
</html>
